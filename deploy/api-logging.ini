[loggers]
keys=root,uvicorn_error,uvicorn_access

[handlers]
keys=console,file

[formatters]
keys=default,access

[logger_root]
level=INFO
handlers=console,file

[logger_uvicorn_error]
level=INFO
handlers=console,file
propagate=0
qualname=uvicorn.error

[logger_uvicorn_access]
level=INFO
handlers=console,file
propagate=0
qualname=uvicorn.access

[handler_console]
class=StreamHandler
formatter=default
args=(sys.stderr,)

[handler_file]
class=FileHandler
formatter=default
args=('/data/logs/api.log','a','utf-8')

[formatter_default]
class=uvicorn.logging.DefaultFormatter
format=%(asctime)s %(levelprefix)s %(message)s
use_colors=None

[formatter_access]
class=uvicorn.logging.AccessFormatter
format=%(asctime)s %(levelprefix)s %(client_addr)s - "%(request_line)s" %(status_code)s
use_colors=None
