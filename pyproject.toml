[project]
name = "product-factory-api"
version = "0.1.0"
description = "Deterministic control plane for Product Factory Agent"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic==1.19.1",
  "fastapi==0.141.1",
  "httpx>=0.28,<1",
  "langgraph==1.2.11",
  "psycopg[binary]>=3.2,<4",
  "pydantic==2.13.4",
  "pydantic-settings>=2.10,<3",
  "python-dotenv>=1,<2",
  "sqlalchemy==2.0.52",
  "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "ruff>=0.12,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["apps/api"]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "integration: requires the configured PostgreSQL instance",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
  "fastapi.Depends",
  "fastapi.Header",
  "fastapi.Query",
]
