<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>D5 hover 最新标注同屏对照</title><style>*{box-sizing:border-box}body{margin:0;padding:18px;background:#f4efea;color:#242321;font:13px/1.5 "SFMono-Regular","PingFang SC",monospace}h1{margin:0 0 6px;font-size:22px}p{margin:0 0 18px;color:#5f5b56}.row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:18px}.card{padding:10px;background:#fbf8f4;border-top:7px solid #ffd71f}.row:nth-of-type(3) .card{border-top-color:#63baf2}.row:nth-of-type(4) .card{border-top-color:#40c7b0}h2{margin:0 0 8px;font-size:14px}img{display:block;width:100%;height:430px;object-fit:contain;background:#ebe5df}@media(max-width:760px){.row{grid-template-columns:1fr}img{height:auto}}</style></head><body><h1>造物工场 · 最新 hover 标注与实现同屏对照</h1><p>左侧是用户标注，右侧是 1440×900 CSS 视口下的生产模式实现。红框只用于指出目标区域，不属于 UI。</p><div class="row"><section class="card"><h2>1A 用户标注：审批卡本体静止</h2><img src="d5-gate-hover-annotation-2026-08-22.png" alt="Gate 用户标注"></section><section class="card"><h2>1B 实现：卡片静止，按钮 hover</h2><img src="d5-gate-button-hover-production-desktop-1440x900-2026-08-22.png" alt="Gate 按钮 hover 实现"></section></div><div class="row"><section class="card"><h2>2A 用户标注：Artifact 增加动效</h2><img src="d5-artifact-hover-annotation-2026-08-22.png" alt="Artifact 用户标注"></section><section class="card"><h2>2B 实现：Artifact 位移与承托</h2><img src="d5-artifact-hover-production-desktop-1440x900-2026-08-22.png" alt="Artifact hover 实现"></section></div><div class="row"><section class="card"><h2>3A 用户标注：参与者增加动效并显示“我”</h2><img src="d5-participant-hover-annotation-2026-08-22.png" alt="参与者用户标注"></section><section class="card"><h2>3B 实现：参与者“我” hover</h2><img src="d5-participant-hover-production-desktop-1440x900-2026-08-22.png" alt="参与者 hover 实现"></section></div></body></html>
